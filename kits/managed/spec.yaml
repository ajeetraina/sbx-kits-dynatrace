schemaVersion: "1"
kind: mixin
name: dynatrace
displayName: Dynatrace Managed (self-hosted)
description: "Installs the Dynatrace Managed MCP server (@dynatrace-oss/dynatrace-managed-mcp-server) and wires it to a self-hosted Dynatrace Managed cluster. Edit the cluster host in this spec, store the API token with `sbx secret set -g dynatrace`, and the sbx proxy injects it as an Api-Token header. Meant to be run from a local clone: sbx run --kit ./kits/managed"
sourceURL: https://github.com/ajeetraina/sbx-kits-dynatrace

# Dynatrace Managed clusters live on a hostname only you know, so this kit is
# meant to be run from a local clone you edit. Replace managed.example.com below
# with your cluster host in ALL THREE places (allowedDomains, serviceDomains,
# and the apiEndpointUrl / dynatraceUrl inside DT_ENVIRONMENT_CONFIGS), and set
# your environment id + alias.
network:
  allowedDomains:
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org
    - managed.example.com      # <-- your Dynatrace Managed cluster host
  serviceDomains:
    managed.example.com: dynatrace   # <-- same host
  serviceAuth:
    dynatrace:
      # Dynatrace Managed API v2 authenticates with `Authorization: Api-Token <token>`.
      headerName: Authorization
      valueFormat: "Api-Token %s"

environment:
  variables:
    # One entry per Managed environment. apiToken is a sentinel — the sbx proxy
    # swaps in the real token from the stored `dynatrace` secret on the wire, so
    # it never enters the sandbox. Edit apiEndpointUrl/dynatraceUrl/environmentId/
    # alias for your cluster (keep apiToken as "proxy-managed").
    DT_ENVIRONMENT_CONFIGS: |
      [{"dynatraceUrl":"https://managed.example.com/e/","apiEndpointUrl":"https://managed.example.com/e/","environmentId":"YOUR-ENV-ID","alias":"prod","apiToken":"proxy-managed"}]
    # Declared so the credential wiring names the same sentinel the proxy injects.
    DT_API_TOKEN: "proxy-managed"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"
  proxyManaged:
    - DT_API_TOKEN

credentials:
  sources:
    dynatrace:
      env:
        - DT_API_TOKEN

commands:
  install:
    - command: "npm install -g @dynatrace-oss/dynatrace-managed-mcp-server@1.0.1"
      user: "0"
      description: "Install the pinned Dynatrace Managed MCP server (bin: mcp-server-dynatrace) globally onto PATH"
    - command: "pip install --break-system-packages 'requests>=2.31,<3'"
      user: "1000"
      description: "Install the requests library used by the runbook"
  startup:
    - command: ["sh", "-c", "command -v claude >/dev/null 2>&1 && claude mcp add dynatrace -- mcp-server-dynatrace >/dev/null 2>&1 || true"]
      user: "1000"
      description: "Register the Dynatrace Managed MCP server with the Claude agent (best-effort; no-op elsewhere)"
  initFiles:
    - path: /home/agent/.dynatrace/mcp.json
      mode: "0644"
      onlyIfMissing: true
      description: "Portable stdio MCP definition for Dynatrace Managed — edit the cluster host / env id"
      content: |
        {
          "mcpServers": {
            "dynatrace": {
              "command": "mcp-server-dynatrace",
              "args": [],
              "env": {
                "DT_ENVIRONMENT_CONFIGS": "[{\"dynatraceUrl\":\"https://managed.example.com/e/\",\"apiEndpointUrl\":\"https://managed.example.com/e/\",\"environmentId\":\"YOUR-ENV-ID\",\"alias\":\"prod\",\"apiToken\":\"proxy-managed\"}]"
              }
            }
          }
        }
memory: |
  ## Dynatrace observability tooling (Dynatrace Managed, self-hosted)

  The Dynatrace Managed MCP server (`@dynatrace-oss/dynatrace-managed-mcp-server`)
  is installed on PATH as `mcp-server-dynatrace` and registered with the agent as
  `dynatrace`, wired to the self-hosted cluster described in
  `DT_ENVIRONMENT_CONFIGS`. Through it you can query problems, security problems,
  events, metrics, logs and topology from the Managed Environment API.

  No token lives in the sandbox: the `apiToken` in `DT_ENVIRONMENT_CONFIGS` is a
  proxy-managed placeholder and the sbx proxy swaps in the real API token
  (`Authorization: Api-Token …`) on outbound requests to your cluster host. Note
  Managed uses classic API-token scopes (problems.read, entities.read,
  securityProblems.read, DataExport, …), which differ from SaaS platform tokens.
  The `~/runbooks/managed_report.py` runbook prints open problems via the
  Managed Environment API v2.
