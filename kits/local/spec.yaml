schemaVersion: "1"
kind: mixin
name: dynatrace
displayName: Dynatrace (SaaS, self-hosted MCP - DEPRECATED)
description: "Installs the self-hosted Dynatrace MCP server (@dynatrace-oss/dynatrace-mcp-server) into the sandbox and wires it to a Dynatrace SaaS environment. The kit holds no token: store it once with `sbx secret set-custom --host '*.apps.dynatrace.com' --env DT_PLATFORM_TOKEN --value \"$DT_TOKEN\"` and the sbx proxy injects it as a Bearer token on requests to *.apps.dynatrace.com. DEPRECATED: the upstream server (github.com/dynatrace-oss/dynatrace-mcp) is deprecated - 2.1.2 was the final release and Dynatrace directs users to the hosted Remote MCP server. Use the `remote` kit instead; this kit is kept only for setups that need a self-hosted stdio server on the pinned 2.1.2."
sourceURL: https://github.com/ajeetraina/sbx-kits-dynatrace

network:
  allowedDomains:
    - registry.npmjs.org       # npm metadata + tarball for the MCP server
    - pypi.org                 # requests, used by the runbooks
    - files.pythonhosted.org
    - "*.apps.dynatrace.com"   # Dynatrace SaaS platform (MCP calls + Grail DQL API)
  # The MCP server sends the platform token as `Authorization: Bearer <token>`
  # to the SaaS platform; the proxy overwrites that header with the real token
  # stored via `sbx secret set-custom` (keyed on this host).
  serviceDomains:
    "*.apps.dynatrace.com": dynatrace
  serviceAuth:
    dynatrace:
      headerName: Authorization
      valueFormat: "Bearer %s"

environment:
  variables:
    # Your Dynatrace SaaS platform URL, e.g. https://abc12345.apps.dynatrace.com
    # (the Gen3 "apps" URL, NOT the classic *.live.dynatrace.com).
    DT_ENVIRONMENT: "https://YOUR-ENV.apps.dynatrace.com"
    # The server persists its auth state to a file (no OS keychain / browser
    # login) so it runs unattended in the headless sandbox. It reads the token
    # from DT_PLATFORM_TOKEN, which `sbx secret set-custom --env DT_PLATFORM_TOKEN`
    # sets to a placeholder the proxy swaps on the wire.
    DT_MCP_TOKEN_STORAGE: "file"
    # No telemetry egress - keeps the network allow-list tight.
    DT_MCP_DISABLE_TELEMETRY: "true"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"

commands:
  install:
    - command: "npm install -g @dynatrace-oss/dynatrace-mcp-server@2.1.2"
      user: "0"
      description: "Install the pinned Dynatrace MCP server (bin: mcp-server-dynatrace) globally onto PATH"
    - command: "pip install --break-system-packages 'requests>=2.31,<3'"
      user: "1000"
      description: "Install the requests library used by the DQL runbooks"
  startup:
    # Best-effort: register the stdio MCP server with the Claude agent if present.
    # It inherits DT_ENVIRONMENT / DT_PLATFORM_TOKEN from the sandbox env.
    - command: ["sh", "-c", "command -v claude >/dev/null 2>&1 && claude mcp add dynatrace -- mcp-server-dynatrace >/dev/null 2>&1 || true"]
      user: "1000"
      description: "Register the Dynatrace MCP server with the Claude agent (best-effort; no-op elsewhere)"
  initFiles:
    - path: /home/agent/.dynatrace/mcp.json
      mode: "0644"
      onlyIfMissing: true
      description: "Portable stdio MCP definition - copy into any agent that reads an mcpServers block"
      content: |
        {
          "mcpServers": {
            "dynatrace": {
              "command": "mcp-server-dynatrace",
              "args": [],
              "env": {
                "DT_ENVIRONMENT": "https://YOUR-ENV.apps.dynatrace.com",
                "DT_MCP_TOKEN_STORAGE": "file"
              }
            }
          }
        }
memory: |
  ## Dynatrace observability tooling (SaaS, self-hosted MCP - DEPRECATED)

  NOTE: the upstream self-hosted server (`@dynatrace-oss/dynatrace-mcp-server`,
  github.com/dynatrace-oss/dynatrace-mcp) is deprecated - `2.1.2` was the final
  release and Dynatrace directs users to the hosted Remote MCP server. Prefer the
  `remote` kit; this pinned `2.1.2` install is kept only for self-hosted stdio setups.

  The Dynatrace MCP server (`@dynatrace-oss/dynatrace-mcp-server`) is installed
  on PATH as `mcp-server-dynatrace` and registered with the agent as
  `dynatrace`, wired to the SaaS environment in `DT_ENVIRONMENT`
  (`https://<env>.apps.dynatrace.com`). Through it you can list problems,
  security vulnerabilities and exceptions, find entities, run and explain DQL
  against Grail, and talk to Davis CoPilot.

  No token lives in the sandbox: it is stored on the host with
  `sbx secret set-custom --host '*.apps.dynatrace.com' --env DT_PLATFORM_TOKEN`,
  which sets `DT_PLATFORM_TOKEN` to a placeholder the MCP server sends and the
  sbx proxy swaps for the real platform token on outbound requests to
  `*.apps.dynatrace.com`. The upstream local server is deprecated (final release
  `2.1.2`); the hosted Remote MCP (`remote` kit) is the recommended path.

  For quick scripting the `requests`-based runbooks in `~/runbooks/` run DQL
  directly against the Grail query API - e.g.
  `python3 ~/runbooks/dynatrace_report.py`.
