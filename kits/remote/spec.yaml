schemaVersion: "1"
kind: mixin
name: dynatrace
displayName: Dynatrace (SaaS, Remote MCP)
description: "Wires an agent to a Dynatrace SaaS environment through the official hosted Dynatrace Remote MCP server (no install) — query problems, vulnerabilities, entities, logs and run DQL against Grail. The kit holds no token: store it once with `sbx secret set -g dynatrace` and the sbx proxy injects it as a Bearer token on requests to *.apps.dynatrace.com."
sourceURL: https://github.com/ajeetraina/sbx-kits-dynatrace

network:
  allowedDomains:
    - pypi.org                 # requests, used by the runbooks
    - files.pythonhosted.org
    - "*.apps.dynatrace.com"   # Dynatrace SaaS platform (Remote MCP + Grail DQL API)
  # Route every request to the SaaS platform through the "dynatrace" service so
  # the proxy can attach the platform token. All Gen3 SaaS platform traffic
  # (the Remote MCP gateway and the DQL query API) lives under *.apps.dynatrace.com.
  serviceDomains:
    "*.apps.dynatrace.com": dynatrace
  serviceAuth:
    dynatrace:
      headerName: Authorization
      valueFormat: "Bearer %s"

environment:
  variables:
    # Your Dynatrace SaaS platform URL, e.g. https://abc12345.apps.dynatrace.com
    # (the Gen3 "apps" URL, NOT the classic *.live.dynatrace.com). This is the one
    # value the kit cannot know for you — edit it in a local clone
    # (`sbx run --kit ./kits/remote`) or `export DT_ENVIRONMENT=...` in-sandbox.
    DT_ENVIRONMENT: "https://YOUR-ENV.apps.dynatrace.com"
    # Sentinel — the sbx proxy swaps in the real platform token from the stored
    # `dynatrace` secret on the wire, so the token never enters the sandbox.
    DT_PLATFORM_TOKEN: "proxy-managed"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"
  proxyManaged:
    - DT_PLATFORM_TOKEN

credentials:
  sources:
    dynatrace:
      env:
        - DT_PLATFORM_TOKEN

commands:
  install:
    - command: "pip install --break-system-packages 'requests>=2.31,<3'"
      user: "1000"
      description: "Install the requests library used by the DQL runbooks"
  startup:
    # Best-effort: register the hosted Remote MCP server with the Claude agent.
    # Skipped while DT_ENVIRONMENT is still the placeholder; guarded + `|| true`
    # so it is a no-op for other agents and never fails startup.
    - command: ["sh", "-c", "command -v claude >/dev/null 2>&1 || exit 0; case \"$DT_ENVIRONMENT\" in *YOUR-ENV*) exit 0 ;; esac; claude mcp add --transport http dynatrace \"$DT_ENVIRONMENT/platform-reserved/mcp-gateway/v0.1/servers/dynatrace-mcp/mcp\" --header \"Authorization: Bearer proxy-managed\" >/dev/null 2>&1 || true"]
      user: "1000"
      description: "Register the Dynatrace Remote MCP server with the Claude agent (best-effort; no-op elsewhere)"
  initFiles:
    - path: /home/agent/.dynatrace/mcp.json
      mode: "0644"
      onlyIfMissing: true
      description: "Portable Remote MCP definition — set your DT_ENVIRONMENT host, then import into any agent that reads an mcpServers block"
      content: |
        {
          "mcpServers": {
            "dynatrace": {
              "type": "http",
              "url": "https://YOUR-ENV.apps.dynatrace.com/platform-reserved/mcp-gateway/v0.1/servers/dynatrace-mcp/mcp",
              "headers": {
                "Authorization": "Bearer proxy-managed"
              }
            }
          }
        }
memory: |
  ## Dynatrace observability tooling (SaaS, Remote MCP)

  The official Dynatrace **Remote MCP server** is registered with the agent as
  `dynatrace`, pointed at the SaaS environment in `DT_ENVIRONMENT`
  (`https://<env>.apps.dynatrace.com`). It is hosted by Dynatrace — nothing is
  installed in the sandbox. Through it you can list problems, security
  vulnerabilities and exceptions, find entities, run and explain DQL against
  Grail, and talk to Davis CoPilot.

  No token lives in the sandbox: `DT_PLATFORM_TOKEN` is a proxy-managed
  placeholder and the sbx proxy swaps in the real platform token on outbound
  requests to `*.apps.dynatrace.com`. If MCP calls fail with auth errors, check
  that `DT_ENVIRONMENT` is set to your real `*.apps.dynatrace.com` URL and that a
  token is stored (`sbx secret ls` shows a `dynatrace` entry).

  For quick scripting the `requests`-based runbooks in `~/runbooks/` run DQL
  directly against the Grail query API — `python3 ~/runbooks/run_dql.py 'fetch
  dt.davis.problems | limit 10'` or `python3 ~/runbooks/dynatrace_report.py`.
